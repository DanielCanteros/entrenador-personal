<!--
  PLACEHOLDER — Verificación de Google Search Console.

  Cuando verifiques el dominio en Google Search Console con el método
  "Archivo HTML", Google te dará un archivo con un nombre único, por ejemplo:
  google1234567890abcdef.html

  Pasos:
  1. Descarga ese archivo desde Search Console (o copia su contenido).
  2. Sustituye este archivo por el que te dieron, respetando el nombre EXACTO
     que indica Google (debe estar en frontend/public/, no dentro de [locale]).
  3. Verifica en Search Console.

  Alternativa sin archivo: usa la variable de entorno
  NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION (ver frontend/.env.local.example),
  que añade la meta etiqueta de verificación automáticamente en el <head>.
-->
google-site-verification: pendiente-de-reemplazar-por-el-archivo-real-de-search-console
